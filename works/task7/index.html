<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        div {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0px 4px 16px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            margin-bottom: 10px;
            background-color: #f8f8f8;
            color: #333;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.2);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #addTaskBtn {
            background-color: #28a745;
            color: white;
        }
        #undoTaskBtn {
            background-color: #dc3545;
            color: white;
        }
        button:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }
        #taskList {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #f8f8f8;
            color: #333;
            margin-top: 10px;
            box-sizing: border-box;
            resize: none;
        }
        div > div {
            font-size: 16px;
            color: #555;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div>
        <h1>Task Manager</h1>
        <input type="text" id="taskName" placeholder="Enter Task Name">
        <div style="width: 90%;">
            <button id="addTaskBtn">ADD Task</button>
            <button id="undoTaskBtn">UNDO Task</button>
        </div>
        <textarea id="taskList" rows="5" cols="30" readonly></textarea>
    </div>

    <script>
        let taskList = [];
        let undoneTasks = [];

        document.getElementById("addTaskBtn").onclick = function() {
            const taskName = document.getElementById("taskName").value;
            if (taskName !== "") {
                taskList.push(taskName);
                document.getElementById("taskName").value = "";
                updateTaskList();
            }
        };

        document.getElementById("undoTaskBtn").onclick = function() {
            if (taskList.length > 0) {
                undoneTasks.push(taskList.pop());
                updateTaskList();
            }
        };

        function updateTaskList() {
            document.getElementById("taskList").value = taskList.join("\n");
        }
    </script>
</body>
</html>
