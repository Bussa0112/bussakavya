<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #div2 {
            font-size: 24px;
            color: #333;
            margin: 10px 0;
        }

        input {
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            border: 2px solid #ccc;
            border-radius: 5px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <div id="div2">WELCOME TO MY DYNAMIC PROJECT GALLERY</div>
    <input type="text" placeholder="Enter Name" id="username"/>
    <button onclick="demo();">Click Here</button>
    <script>
        function demo() {
            var username = document.getElementById("username").value;
            alert("WELCOME TO MY PROJECT, " + username + "!");
        }
    </script>
</body>
</html>
