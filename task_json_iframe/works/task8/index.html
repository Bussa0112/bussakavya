<!DOCTYPE html>
<html >
<head>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        #user_input {
            width: 200px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            background-color: #f8f8f8;
            color: #333;
            outline: none;
            transition: border 0.3s ease;
        }
        #user_input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.2);
        }
        #content_div {
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            padding: 10px;
            width: 300px;
            text-align: center;
            background-color: #fff;
            border-radius: 6px;
            box-shadow: 0px 4px 16px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            min-height: 100px;
        }
        h1 {
            font-size: 28px;
            color: #333;
            font-weight: 600;
            margin-bottom: 20px;
        }
        ::placeholder {
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Shape Generator</h1>
    <input id="user_input" placeholder="Enter size" onkeyup="generate_shape()">
    <div id="content_div"></div>

    <script>
        let colors = ["red", "blue", "green"];
        let indx = 0;
        let size = colors.length;

        function generate_shape() {
            let n = parseInt(document.getElementById("user_input").value);
            let text = "";
            let i = 0;
            if (!isNaN(n) && n > 0) {
                do {
                    let j = 0;
                    do {
                        text += "*";
                        j++;
                    } while (j < i);
                    text += "<br>";
                    i++;
                } while (i <= n);
                document.getElementById("content_div").innerHTML = text;
                document.getElementById("content_div").style = "color:" + colors[indx];
                indx = (indx + 1) % size;
            } else {
                document.getElementById("content_div").innerHTML = "Please enter a valid number.";
            }
        }
    </script>
</body>
</html>
